<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assessment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Runs before the bundle so the first paint is already correct. Deciding
      // the theme inside React means one frame of white on a dark-default app.
      (function () {
        var t = 'dark';
        try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
